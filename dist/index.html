<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f6" />
    <meta name="description" content="Пустая интерактивная веб-книга с перелистыванием." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23eef0f0'/%3E%3Cpath d='M14 12h27a9 9 0 0 1 9 9v31H23a9 9 0 0 1-9-9V12Z' fill='%23d9dcdd' stroke='%2393a0a8' stroke-width='3'/%3E%3Cpath d='M23 14v36' stroke='%23ffffff' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Книга</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="scroll-track" aria-label="Пустая интерактивная книга">
      <section class="scene">
        <div class="halo" aria-hidden="true"></div>
        <div class="book-wrap">
          <div class="floor-shadow" aria-hidden="true"></div>
          <div class="book" id="book" role="button" tabindex="0" aria-expanded="false" aria-label="Книга; прокручивайте, чтобы листать, или нажмите, чтобы приблизить разворот">
            <div class="back-cover" aria-hidden="true"></div>
            <div class="page-stack" aria-hidden="true"></div>
            <div class="page page-4" aria-hidden="true"><span class="page-face page-front"></span><span class="page-face page-back"></span></div>
            <div class="page page-3" aria-hidden="true"><span class="page-face page-front"></span><span class="page-face page-back"></span></div>
            <div class="page page-2" aria-hidden="true"><span class="page-face page-front"></span><span class="page-face page-back"></span></div>
            <div class="page page-1">
              <div class="page-face page-front" data-bg-color="rose" data-bg-pattern="dots">
                <section class="keeper-profile" aria-label="Анкета хранителя дневника">
                  <header class="keeper-header">
                    <button type="button" class="avatar-slot" data-photo-shape="rectangle" aria-label="Добавить фотографию" disabled>
                      <svg class="avatar-outline" viewBox="0 0 90 120" preserveAspectRatio="none" aria-hidden="true">
                        <rect x="2" y="2" width="86" height="116" rx="15"></rect>
                      </svg>
                      <span class="avatar-empty" aria-hidden="true"><b>+</b><small>ФОТО</small></span>
                      <span class="avatar-photo-frame" aria-hidden="true">
                        <span class="avatar-photo-window">
                          <img class="avatar-image" alt="Фотография хранителя дневника" />
                        </span>
                        <img class="avatar-frame-art" alt="" />
                      </span>
                    </button>
                    <div class="keeper-heading">
                      <p>ХРАНИТЕЛЬ ДНЕВНИКА</p>
                      <h1>Это я</h1>
                    </div>
                  </header>
                  <div class="background-tools" aria-label="Оформление фона">
                    <span>ФОН</span>
                    <div class="background-options" role="group" aria-label="Цвет фона">
                      <button type="button" class="background-choice color-choice color-rose" data-bg-color="rose" aria-label="Розовый фон" aria-pressed="true" disabled></button>
                      <button type="button" class="background-choice color-choice color-sky" data-bg-color="sky" aria-label="Голубой фон" aria-pressed="false" disabled></button>
                      <button type="button" class="background-choice color-choice color-leaf" data-bg-color="leaf" aria-label="Зелёный фон" aria-pressed="false" disabled></button>
                      <button type="button" class="background-choice color-choice color-sun" data-bg-color="sun" aria-label="Жёлтый фон" aria-pressed="false" disabled></button>
                    </div>
                    <div class="background-options pattern-options" role="group" aria-label="Узор фона">
                      <button type="button" class="background-choice pattern-choice pattern-dots" data-bg-pattern="dots" aria-label="Узор в точки" aria-pressed="true" disabled></button>
                      <button type="button" class="background-choice pattern-choice pattern-grid" data-bg-pattern="grid" aria-label="Узор в клетку" aria-pressed="false" disabled></button>
                      <button type="button" class="background-choice pattern-choice pattern-stripes" data-bg-pattern="stripes" aria-label="Узор в полоску" aria-pressed="false" disabled></button>
                    </div>
                  </div>
                  <label class="keeper-field keeper-name">
                    <span>Меня зовут</span>
                    <input type="text" autocomplete="name" disabled />
                  </label>
                  <div class="keeper-row">
                    <label class="keeper-field">
                      <span>День рождения</span>
                      <input type="text" inputmode="numeric" disabled />
                    </label>
                    <label class="keeper-field">
                      <span>Мой город</span>
                      <input type="text" autocomplete="address-level2" disabled />
                    </label>
                  </div>
                  <label class="keeper-field keeper-about">
                    <span>Пара слов обо мне</span>
                    <textarea rows="2" disabled></textarea>
                  </label>
                </section>
              </div>
              <span class="page-face page-back" aria-hidden="true"></span>
            </div>
            <div class="cover" aria-hidden="true">
              <span class="cover-inset"></span>
              <span class="mark"><i></i><i></i><i></i><i></i></span>
            </div>
            <div class="spine" aria-hidden="true"></div>
          </div>
        </div>
        <button class="close-focus" type="button" aria-label="Вернуться к просмотру книги">×</button>
        <p class="instruction">КЛИК · КОЛЕСО · СВАЙП</p>
        <span class="scroll-cue" aria-hidden="true">ЛИСТАЙ ВНИЗ<br><b>↓</b></span>
      </section>
    </main>
    <dialog class="photo-editor" aria-label="Редактор фотографии" aria-describedby="photo-editor-hint">
      <div class="photo-editor-card">
        <span class="photo-editor-handle" aria-hidden="true"></span>
        <button class="photo-editor-close" type="button" aria-label="Закрыть редактор">×</button>
        <input class="photo-file" type="file" accept="image/*" hidden />
        <div class="frame-carousel" role="listbox" aria-label="Рамка фотографии">
          <button class="frame-option" type="button" role="option" data-shape="rectangle" aria-label="Прямоугольная рамка" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span></span>
          </button>
          <button class="frame-option" type="button" role="option" data-shape="circle" aria-label="Круглая рамка" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span></span>
          </button>
          <button class="frame-option" type="button" role="option" data-shape="instax" aria-label="Рамка Instax" aria-selected="true">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ВЫБРАТЬ<br />ФОТО</span></span></span>
          </button>
          <button class="frame-option frame-option-asset" type="button" role="option" data-shape="camera" aria-label="Рамка в виде камеры" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span><img class="frame-art" src="./assets/frames/camera-frame.png" alt="" /></span>
          </button>
          <button class="frame-option frame-option-asset" type="button" role="option" data-shape="phone" aria-label="Рамка в виде телефона" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span><img class="frame-art" src="./assets/frames/phone-frame.png" alt="" /></span>
          </button>
          <button class="frame-option frame-option-asset" type="button" role="option" data-shape="lovers" aria-label="Рамка Lovers Club" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span><img class="frame-art" src="./assets/frames/lovers-card-frame.png" alt="" /></span>
          </button>
          <button class="frame-option frame-option-asset" type="button" role="option" data-shape="locket" aria-label="Рамка-брелок в форме сердца" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span><img class="frame-art" src="./assets/frames/heart-locket-frame.png" alt="" /></span>
          </button>
          <button class="frame-option frame-option-asset" type="button" role="option" data-shape="star-polaroid" aria-label="Рамка Polaroid с золотыми звёздами" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span><img class="frame-art" src="./assets/frames/star-polaroid-frame.png" alt="" /></span>
          </button>
          <button class="frame-option frame-option-asset" type="button" role="option" data-shape="silver-heart" aria-label="Серебряная рамка-сердце" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span><img class="frame-art" src="./assets/frames/silver-heart-frame.png" alt="" /></span>
          </button>
          <button class="frame-option frame-option-asset" type="button" role="option" data-shape="holographic" aria-label="Голографическая рамка" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span><img class="frame-art" src="./assets/frames/holographic-frame.png" alt="" /></span>
          </button>
          <button class="frame-option frame-option-asset" type="button" role="option" data-shape="cats" aria-label="Рамка Polaroid с котиками" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span><img class="frame-art" src="./assets/frames/cat-polaroid-frame.png" alt="" /></span>
          </button>
          <button class="frame-option frame-option-asset" type="button" role="option" data-shape="lace-heart" aria-label="Красная кружевная рамка-сердце" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span><img class="frame-art" src="./assets/frames/lace-heart-frame.png" alt="" /></span>
          </button>
          <button class="frame-option frame-option-asset" type="button" role="option" data-shape="lace-oval" aria-label="Белая кружевная овальная рамка" aria-selected="false">
            <span class="frame-card"><span class="frame-window"><img class="frame-image" alt="" /><span class="frame-empty">ФОТО</span></span><img class="frame-art" src="./assets/frames/lace-oval-frame.png" alt="" /></span>
          </button>
        </div>
        <p class="visually-hidden" id="photo-editor-hint">Нажмите на центральную рамку, чтобы выбрать фото. Боковые рамки можно листать.</p>
        <div class="photo-editor-bottom">
          <label class="zoom-control">
            <span>Масштаб</span>
            <input class="photo-zoom" type="range" min="1" max="3" step="0.01" value="1" />
          </label>
          <footer class="photo-editor-actions">
            <button class="photo-cancel" type="button">Отмена</button>
            <button class="photo-apply" type="button" disabled>Готово</button>
          </footer>
        </div>
      </div>
    </dialog>
    <script src="./script.js"></script>
  </body>
</html>
