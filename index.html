<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d211f" />
    <meta name="description" content="Интерактивная веб-книга с реалистичным перелистыванием страниц." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238d2637'/%3E%3Cpath d='M14 17c8-2 14 0 18 5 4-5 10-7 18-5v32c-8-2-14 0-18 5-4-5-10-7-18-5V17z' fill='%23f4ead8'/%3E%3Cpath d='M32 22v32' stroke='%23691b2a' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Тихие страницы</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="scene" aria-label="Интерактивная книга">
      <div class="scene-glow" aria-hidden="true"></div>
      <p class="hint" id="hint">Нажмите на обложку, чтобы открыть книгу</p>
      <div class="book-stage" id="bookStage">
        <div class="book-shadow" aria-hidden="true"></div>
        <div class="book" id="book" data-state="closed">
          <div class="back-board" aria-hidden="true"></div>
          <button class="cover back-cover" id="backCover" aria-label="Вернуться к последнему развороту">
            <span class="cover-edge" aria-hidden="true"></span>
            <span class="back-cover-content"><span>✦</span><small>Конец альбома</small></span>
            <i class="cover-shade" aria-hidden="true"></i>
          </button>
          <div class="page-stack left-stack" id="leftStack" aria-hidden="true"></div>
          <div class="page-stack right-stack" id="rightStack" aria-hidden="true"></div>

          <button class="page static-page left-page" id="leftPage" aria-label="Предыдущая страница">
            <span class="paper-content"></span>
          </button>
          <button class="page static-page right-page" id="rightPage" aria-label="Следующая страница">
            <span class="paper-content"></span>
          </button>

          <div class="flipping-page" id="flippingPage" aria-hidden="true">
            <div class="face face-front"><span class="paper-content"></span><i class="turn-shade"></i></div>
            <div class="face face-back"><span class="paper-content"></span><i class="turn-shade"></i></div>
          </div>

          <button class="cover front-cover" id="frontCover" aria-label="Открыть книгу">
            <span class="cover-edge" aria-hidden="true"></span>
            <span class="cover-inside" aria-hidden="true"><i></i></span>
            <span class="cover-content">
              <small>Небольшой альбом</small>
              <span class="cover-mark" aria-hidden="true">✦</span>
              <strong>ТИХИЕ<br />СТРАНИЦЫ</strong>
              <em>собрание моментов</em>
            </span>
            <i class="cover-shade" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="progress" id="progress" aria-live="polite"></div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
